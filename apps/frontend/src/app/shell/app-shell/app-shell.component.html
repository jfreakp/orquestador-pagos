<div class="shell">
  <aside class="shell-nav">
    <div class="brand">
      <span class="brand-name">Orquestador</span>
      <span class="brand-tag">Gateway Manager</span>
    </div>

    <nav>
      <span class="nav-group-label">Catálogos</span>
      <a routerLink="/admin/gateways" routerLinkActive="active">
        <span class="material-symbols-outlined">extension</span>
        Gateways
      </a>
      <a routerLink="/admin/channels" routerLinkActive="active">
        <span class="material-symbols-outlined">alt_route</span>
        Canales
      </a>
      <a routerLink="/admin/transaction-statuses" routerLinkActive="active">
        <span class="material-symbols-outlined">flag</span>
        Estados de transacción
      </a>
      <a routerLink="/admin/gateway-operation-types" routerLinkActive="active">
        <span class="material-symbols-outlined">settings_suggest</span>
        Tipos de operación
      </a>
      <a routerLink="/admin/error-categories" routerLinkActive="active">
        <span class="material-symbols-outlined">error</span>
        Categorías de error
      </a>
      <a routerLink="/admin/client-systems" routerLinkActive="active">
        <span class="material-symbols-outlined">dns</span>
        Sistemas cliente
      </a>
      <a routerLink="/admin/gateway-configs" routerLinkActive="active">
        <span class="material-symbols-outlined">key</span>
        Configuración de gateways
      </a>

      <span class="nav-group-label">Monitoreo</span>
      <a
        routerLink="/transaction-monitor/transactions"
        routerLinkActive="active"
      >
        <span class="material-symbols-outlined">receipt_long</span>
        Transacciones
      </a>
      <a
        routerLink="/transaction-monitor/transaction-errors"
        routerLinkActive="active"
      >
        <span class="material-symbols-outlined">report</span>
        Errores de transacción
      </a>
    </nav>

    <div class="admin-token">
      <label>
        Token admin
        <input
          type="password"
          [(ngModel)]="tokenInput"
          (change)="saveToken()"
          placeholder="x-admin-token"
        />
      </label>
    </div>
  </aside>

  <main class="shell-content">
    <router-outlet />
  </main>
</div>
