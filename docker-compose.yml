services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # postgres:18+ organizes versioned subdirectories under
      # /var/lib/postgresql (not .../data anymore); mounting the old path
      # makes the container refuse to start ("unused mount/volume").
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      # Expuesto al host para poder correr el backend/Prisma en local
      # (npx nx serve backend, prisma migrate dev) contra esta misma DB.
      - '5432:5432'

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      # Built here, not read literally from .env: the .env DATABASE_URL is
      # for local dev (127.0.0.1) and would not resolve inside the
      # container, where postgres is reachable at hostname `postgres`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      APP_ENCRYPTION_MASTER_KEY: ${APP_ENCRYPTION_MASTER_KEY}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      PORT: ${PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:3000'

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - '8080:80'

volumes:
  postgres_data:
